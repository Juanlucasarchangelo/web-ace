server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 32k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $checkout_upstream "web:80";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Only the public checkout SPA and its compiled assets are reachable.
    location = / { proxy_pass http://$checkout_upstream; }
    location ~ ^/(contratar|pagamento|verificar-email|privacidade|termos)$ { proxy_pass http://$checkout_upstream; }
    location ^~ /build/ { proxy_pass http://$checkout_upstream; }
    location = /favicon-ace.svg { proxy_pass http://$checkout_upstream; }

    location = /api/v1/billing/plans {
        limit_except GET { deny all; }
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$checkout_upstream;
    }
    location = /api/v1/billing/coupon/quote {
        limit_except POST { deny all; }
        proxy_pass http://$checkout_upstream;
    }
    location = /api/v1/billing/signup {
        limit_except POST { deny all; }
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$checkout_upstream;
    }
    location = /api/v1/billing/verify-email {
        limit_except POST { deny all; }
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$checkout_upstream;
    }
    location ~ "^/api/v1/billing/orders/[0-9a-fA-F-]{36}$" {
        limit_except GET { deny all; }
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$checkout_upstream;
    }
    location = /sanctum/csrf-cookie {
        limit_except GET { deny all; }
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$checkout_upstream;
    }
    location / { return 404; }
}
